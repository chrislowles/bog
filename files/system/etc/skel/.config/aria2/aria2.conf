# bog aria2 config
# Seeded once via /usr/share/user-tmpfiles.d/bog.conf, then fully yours — edit freely.
# After changing, restart: systemctl --user restart bog-downloads.service
# Note: aria2 does not expand $HOME/%h inside this file, so --dir is set on the command line in the systemd unit instead.

enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
#rpc-secret=change-me

continue=true
max-connection-per-server=8
split=8
min-split-size=1M
disk-cache=64M