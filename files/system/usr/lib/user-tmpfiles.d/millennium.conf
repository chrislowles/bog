# Hooks Millennium into Steam via its libXtst proxy. Idempotent.
# The "-" keeps it quiet until Steam has bootstrapped and the dirs exist.
L+- %h/.local/share/Steam/steamrt64/libXtst.so.6          - - - - /usr/lib/millennium/libmillennium_bootstrap_x64.so
L+- %h/.local/share/Steam/steamrt64/libmillennium_hhx64.so - - - - /usr/lib/millennium/libmillennium_hhx64.so