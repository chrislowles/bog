# I'm unable to patch in a filter list on the remotes without straight up forking the default-flatpaks module so for now I'm just using Bazaar's blocklist functionality
blocklists:
  - block:
    # flatpak releases of system-installed programs
    - io.github.kolunmi.Bazaar
    - ca.desrt.dconf-editor
    - org.gnome.baobab
    - org.gnome.Logs
    - org.gnome.font-viewer
    - org.gnome.TextEditor
    - io.github.zyedidia.micro
    - com.valvesoftware.Steam
    - com.github.Matoking.protontricks
    - org.gnome.gedit
    - org.gnome.Totem
    - org.gnome.eog
    - com.visualstudio.code
    - org.gnome.Extensions
    - dev.edfloreshz.CosmicTweaks
    - io.github.pantheon_tweaks.pantheon-tweaks
    - org.freedesktop.Platform.VulkanLayer.gamescope
    - org.freedesktop.Platform.VulkanLayer.MangoHud
    - org.gnome.Firmware
    - org.gnome.dspy
    - org.gnome.NetworkDisplays
    - org.gnome.SimpleScan

    # Some certain KDE apps that wouldn't make sense in GNOME
    - org.kde.kwalletmanager5
    - org.kde.kwalletmanager
    - org.kde.krdc
    - org.kde.filelight