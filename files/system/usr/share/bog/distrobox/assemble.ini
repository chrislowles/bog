# Section = box name. Available keys per box:
#   image                - full image ref (required)
#   pull                 - true/false, re-pull image before create
#   root                 - true/false, rootful podman box
#   replace              - true/false, replace if already exists
#   start_now            - true/false, start container immediately after create
#   init                 - true/false, use systemd init inside the box
#   nvidia               - true/false, pass through NVIDIA GPU
#   entry                - true/false, generate a host .desktop entry for the box
#   additional_packages  - space-separated packages installed at create-time
#   init_hooks           - shell run inside the box after creation
#   pre_init_hooks       - shell run on the host before container creation

