# See systemd.tmpfiles(5) for syntax. Ensures bog's per-user config and
# service files exist for every account, including ones created before
# a given feature shipped. Sources point at the canonical /etc/skel copies
# so there's a single source of truth for new-account and existing-account
# provisioning alike.
#
# C-type lines only act if the destination is missing — if a user has
# already customized bog.env or the service unit, this will never touch it.

d %h/.config/bog 0700 - - -
C %h/.config/bog/bog.env 0600 - - - /etc/skel/.config/bog/bog.env

d %h/.config/systemd/user 0755 - - -
C %h/.config/systemd/user/bog-media-centre.service 0644 - - - /etc/skel/.config/systemd/user/bog-media-centre.service