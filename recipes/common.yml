---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:

  - type: os-release
    properties:
      ID: bog
      ID_LIKE: fedora
      NAME: bog
      IMAGE_ID: bog
      LOGO: bog-logo

  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - ublue-os/packages
        - hhd-dev/hhd

  - type: dnf
    install:
      exclude:
        # Firefox is Fedora's "browser of choice" and gets pulled in with GNOME installs using dnf (and probably other pkg managers lol) I prefer to just use the flatpak version, easier to deal with and adwaita-ify app for it (idk what it's called, you know the one) works best with the flatpak one (installing and uninstalling)
        - firefox
        - firefox-langpacks
        # Weak dep of GNOME shell, I gotta exclude explicitly. I might make my own first boot intro or tour app, maybe using an app distributed on bog-flatpak remote when I add it in.
        - gnome-tour
      packages:

        # GNOME Core (Minimal)
        - gnome-shell                       # Desktop Interface
        - gnome-session-wayland-session     # Wayland Session
        - gdm                               # Login Manager
        - gnome-control-center              # Settings
        - gnome-system-monitor              # Task Manager
        - gnome-settings-daemon             # Hardware Management
        - xdg-desktop-portal-gnome          # XDG Portal for GNOME
        - gnome-online-accounts             # GOA daemon
        - gnome-keyring                     # Password/Key Management

        # dconf (desktop/etc configuration in GNOME)
        - dconf                             # Basically GNOMEs version of registry keys
        - dconf-editor                      # Basically GNOMEs version of registry editor

        # Essential Interface & Tools
        - gnome-disk-utility                # GNOME Disks
        - gnome-logs                        # SystemD log viewer
        - baobab                            # Directory tree analyzer
        - gnome-font-viewer                 # Font viewer/installer
        - gnome-console                     # Terminal emulator
        - nautilus                          # File manager
        - gnome-text-editor                 # GUI Text editor

        # App Store (ublue-os/packages, check if actually available, was in pkg list in copr repo)
        - bazaar

        # Filesystem Gubbins
        - gvfs                              # Virtual Filesystem (Trash/Mounts)
        - gvfs-client                       # Client modules of backends for the gio framework in GLib
        - gvfs-archive                      # Archiving support for gvfs
        - gvfs-afc                          # AFC support for gvfs
        - gvfs-afp                          # AFP support for gvfs
        - gvfs-fuse                         # FUSE support for gvfs
        - gvfs-goa                          # GOA support for gvfs
        - gvfs-gphoto2                      # gphoto2 support for gvfs
        - gvfs-mtp                          # MTP support for gvfs
        - gvfs-nfs                          # NFS support for gvfs
        - gvfs-smb                          # SMD support for gvfs

        # Wine & Family
        - winetricks                        # Common Wine problem resolver
        - protontricks                      # winetricks wrapper for Proton-specific games/programs

        # Niceties
        - gnome-backgrounds

        # handheld daemon
        - hhd
        - adjustor
        - hhd-ui

        # System Management Beyond Flatpaks (idk how to describe this lol)
        - distrobox                         # Container-based system management
        - host-spawn                        # distrobox-host-exec dep
        - steam                             # Primary gaming platform
        - system-reinstall-bootc            # Effective system reset via bootc

        # Misc
        - micro                             # TUI Text Editor
        - git                               # Version control system
        - curl                              # CLI for http transfer/download
        - wget                              # The other CLI for http transfer/download
        - yt-dlp                            # CLI media downloader
        - ffmpeg                            # Suite of media processing libraries
        - rsync                             # Common program for network syncing files
        - rclone                            # Cloud storage management
        - fastfetch                         # System information readout (neofetch-like)

        # Networking
        - NetworkManager-wifi               # Primary tooling for WiFi support

        # X11 (mostly for debugging when patching/pre-configuring fixes for flatpaks)
        - xprop
        - xlsclients
        - xdotool

        # Podman
        - podman                            # Should already be present on uBlue base, explicit just in case
        - podman-compose                    # Fallback CLI if ever needed
        - slirp4netns                       # Rootless networking
        - fuse-overlayfs                    # Rootless storage driver

        # Plymouth
        - plymouth
        - plymouth-system-theme
        #- plymouth-plugin-two-step

        # AppImages
        #- fuse # FUSE 3 (likely already present in base)
        #- fuse2 # needed by most AppImages anyway
        - vulkan-loader
        - vulkan-tools

        # Broad system runtime dependencies (in part, formerly source-built Bazaar dependencies [TODO: TRY TO GET RID OF THESE AS YOU SET THE FLATPAK VERSION UP])
        - flatpak
        - appstream
        #- libsoup3
        #- json-glib
        #- libsecret
        #- libxmlb
        #- libyaml
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - gnome-tour
        - toolbox
        - htop
        #- fedora-release-identity-basic
        #- fedora-logos
        - fedora-bookmarks

  - type: script
    #snippets:
    #  - "sudo systemctl enable hhd@$(whoami)"
    scripts:
      - setup-os-release.sh

  - type: bling
    install:
      - dconf-update-service

  - type: systemd
    user:
      enabled:
        # Noticed a quirk with Bazaar when experimenting with the default-flatpaks key,
        # clearing cache after reverting fixed it so I'm setting as a user service.
        # Basically a cache clear is now intended to be apart of an image update/upgrade now.
        # TODO: consider user and system versions of these services/scripts
        - springclean.service
        - podman-auto-update.timer
    system:
      enabled:
        - gdm.service

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (user)
      - notify: true
        scope: system
        repo:
          title: Flathub (system)
        install:

          # Niceties
          - org.mozilla.firefox

          # Suggested pre-installed system programs
          - io.github.flattool.Warehouse
          - com.github.tchx84.Flatseal
          - com.ranfdev.DistroShelf
          - io.github.flattool.Ignition
          - com.mattjakeman.ExtensionManager

          # Video Games preferred and pre-installed selection
          - com.vysp3r.ProtonPlus
          - com.github.mtkennerly.ludusavi
          - io.github.limo_app.limo

          # Pre-installed selection from GNOME Bazaar curation group
          - org.gnome.Contacts
          - org.gnome.Calendar
          - org.gnome.clocks
          - org.gnome.SoundRecorder
          - org.gnome.Decibels
          - org.gnome.Snapshot
          - org.gnome.Characters
          - org.gnome.SimpleScan
          - org.gnome.Papers

  #- type: script
  #  scripts:
  #    - setup-flatpak-filter.sh

  - type: gnome-extensions
    install:
      - 615     # AppIndicator Support
      #- 1160   # Dash to Panel
      #- 1319   # GSConnect
      #- 36     # Lock Keys
      #- 5904   # Volume Scroller
      #- 779    # Clipboard Indicator
      - 517     # Caffeine
      - 9788    # Quick Sound Switcher
      #- 8      # Places Menu
      #- 5263   # GTK Desktop Icons NG (DING)
      #- 600    # Launch New Instance
      #- 9419   # Video Lockscreen

  - type: gschema-overrides
    include:
      - zz1-pinned.gschema.override
      - zz1-keybinds.gschema.override
      - zz1-ext-enabled.gschema.override
      - zz1-ext-conf.gschema.override
      - zz1-desktop.gschema.override

  # I'd like to somehow pre-install Comic Sans in this, legally ofc lmao
  - type: fonts
    fonts:
      google-fonts:
        - Inter
        - Comic Neue
      #url-fonts:
      #  - name: CustomFont
      #    url: https://example.com/my-font.otf
      #  - name: CompanyFonts
      #    url: https://company.com/fonts.tar.gz

  # Plymouth theming stuff
  - type: initramfs

  - type: signing