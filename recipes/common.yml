---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:

  - type: os-release
    properties:
      ID: bog
      NAME: bog
      IMAGE_ID: bog
      LOGO: bog-logo
      DEFAULT_HOSTNAME: bog

  # Dynamically passing ostree version of the base image into the PRETTY_NAME
  - type: script
    scripts:
      - os-release.sh

  - type: files
    files:
      - source: system
        destination: /

  # Experiment: Seeing if it's worth it to swap out the default kernel for the CachyOS one
  #- type: dnf
  #  repos:
  #    - copr: bochecha/cachyos-kernel-bvm
  #  install:
  #    allow-erasing: true
  #    install-weak-deps: false
  #    packages:
  #      - kernel-cachyos
  #      - kernel-cachyos-devel

  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
        #- herzen/davinci-helper
        #- hhd-dev/hhd
      files:
        - https://cli.github.com/packages/rpm/gh-cli.repo
      keys:
        - https://cli.github.com/packages/githubcli-archive-keyring.asc
    install:
      exclude:
        # Weak dep of GNOME shell, I gotta exclude explicitly. I might make my own first boot intro or tour app, maybe using an app distributed on bog-flatpak remote when I add it in or hardcode it into the image.
        # OR I write it into the image itself
        - gnome-tour
      packages:

        # Official Github CLI
        - repo: gh-cli
          packages:
            - gh

        # GNOME Core (Minimal)
        - gnome-shell                       # Desktop Interface
        - gnome-session-wayland-session     # Wayland Session
        - gdm                               # Login Manager
        - gnome-control-center              # Settings
        - gnome-system-monitor              # Task Manager
        - gnome-settings-daemon             # Hardware Management
        - xdg-desktop-portal-gnome          # XDG Portal for GNOME
        - gnome-online-accounts             # GOA daemon
        - gnome-keyring                     # Password/Key Management

        # dconf (desktop/etc configuration in GNOME)
        - dconf                             # Basically GNOMEs version of registry keys
        - dconf-editor                      # Basically GNOMEs version of registry editor

        # Essential Interface & Tools
        - gnome-disk-utility                # GNOME Disks
        - gnome-logs                        # SystemD log viewer
        - gnome-firmware                    # Firmware Installer/fwupd GUI
        - baobab                            # Directory tree analyzer
        - gnome-font-viewer                 # Font viewer/installer
        - gnome-console                     # Terminal emulator
        - nautilus                          # File manager
        - gnome-text-editor                 # GUI Text editor

        # App Store (ublue-os/packages)
        - bazaar

        # Davinci Helper (herzen/davinci-helper COPR, simple fedora distrobox preset that installs this in a container)
        #- davinci-helper

        # Filesystem Bits
        - gvfs                              # Virtual Filesystem (Trash/Mounts)
        - gvfs-client                       # Client modules of backends for the gio framework in GLib
        - gvfs-archive                      # Archiving support for gvfs
        - gvfs-afc                          # AFC support for gvfs
        - gvfs-afp                          # AFP support for gvfs
        - gvfs-fuse                         # FUSE support for gvfs
        - gvfs-goa                          # GOA support for gvfs
        - gvfs-gphoto2                      # gphoto2 support for gvfs
        - gvfs-mtp                          # MTP support for gvfs
        - gvfs-nfs                          # NFS support for gvfs
        - gvfs-smb                          # SMD support for gvfs

        # Niceties
        - gnome-backgrounds

        # handheld daemon (hhd-dev/hhd COPR repo)
        #- hhd
        #- adjustor
        #- hhd-ui

        # System Management
        - flatpak                           # Distro-agnostic app format
        - distrobox                         # Container-based system management
        - host-spawn                        # distrobox-host-exec dep
        - steam                             # Primary gaming platform
        - system-reinstall-bootc            # Effective system reset via bootc

        # Misc
        - micro                             # TUI Text Editor
        - git                               # Version control system
        - curl                              # CLI for http transfer/download
        - wget                              # The other CLI for http transfer/download
        - aria2                             # Multi-protocol download utility (HTTP/FTP/Metalink/BitTorrent)
        - pipx                              # "Install and Run Python Applications in Isolated Environments"
        - jq                                # Command-line JSON processor
        - yt-dlp                            # Command-line media downloader
        - ffmpeg                            # Suite of media processing libraries
        - rsync                             # Common program for network syncing files
        - rclone                            # Cloud storage management
        - fastfetch                         # System information readout (neofetch-like)

        # Networking
        - NetworkManager-wifi               # Primary tooling for WiFi support

        # X11 (mostly for debugging when patching/pre-configuring fixes for flatpaks)
        - xprop
        - xlsclients
        - xdotool

        # Podman
        - podman                            # Should already be present on uBlue base, explicit just in case
        - podman-compose                    # Fallback CLI if ever needed
        - slirp4netns                       # Rootless networking
        - fuse-overlayfs                    # Rootless storage driver

        # Plymouth
        - plymouth
        - plymouth-system-theme
        #- plymouth-plugin-two-step

        # AppImages
        #- fuse # FUSE 3 (likely already present in base)
        #- fuse2 # needed by most AppImages anyway

        - vulkan-loader
        - vulkan-tools
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - toolbox
        - htop
        - fedora-bookmarks

  - type: bling
    install:
      - dconf-update-service

  - type: systemd
    system:
      enabled:
        - podman-auto-update.timer
        - gdm.service
    user:
      enabled:
        - podman-auto-update.timer

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - io.github.flattool.Warehouse
          - com.github.tchx84.Flatseal
          - com.ranfdev.DistroShelf
          - io.github.flattool.Ignition
          - com.mattjakeman.ExtensionManager
          - com.vysp3r.ProtonPlus
          #- com.github.mtkennerly.ludusavi
          #- net.retrodeck.retrodeck
          - org.freedesktop.LinuxAudio.Plugins.LSP
          - org.freedesktop.LinuxAudio.Plugins.Calf
      - notify: false
        scope: user
        install:
          - org.gnome.Contacts
          - org.gnome.Calendar
          - org.gnome.clocks
          - org.gnome.SoundRecorder
          - org.gnome.Decibels
          - org.gnome.Snapshot
          - org.gnome.Characters
          - org.gnome.SimpleScan
          - org.gnome.Papers
      - notify: false
        scope: user
        repo:
          url: https://international.download.nvidia.com/GFNLinux/flatpak/geforcenow.flatpakrepo
          name: GeForceNOW
          title: GeForce NOW Official Source

  - type: gnome-extensions
    install:
      - 615     # AppIndicator Support
      - 517     # Caffeine
      - 5263    # GTK Desktop Icons NG (DING)
      - 9788    # Quick Sound Switcher
      #- 1160   # Dash to Panel
      #- 1319   # GSConnect

  - type: gschema-overrides
    include:
      - zz1-pinned.gschema.override
      - zz1-keybinds.gschema.override
      - zz1-ext-enabled.gschema.override
      - zz1-ext-conf.gschema.override
      - zz1-desktop.gschema.override

  # I'm thinking of making my own custom fonts, pre-installing and setting them.
  #- type: fonts
  #  fonts:
  #    url-fonts:
  #      - name: bog Serif
  #        url: https://example.com/my-font.otf
  #      - name: bog Sans-Serif
  #        url: https://example.com/my-font.otf

  # Plymouth theming stuff
  - type: initramfs

  # Base level verification for pushing images to GHCR
  - type: signing
