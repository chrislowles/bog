name: Build ISO

on:
  schedule:
    - cron: "0 0 1 * *" # First day of every month at 00:00 UTC
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
    paths:
      - '.github/workflows/build-iso.yml'

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image_name: [bog, bog-nvidia]
        major_version: [44]
        image_tag: [latest]

    steps:
      - name: Set timezone to Sydney
        uses: MathRobin/timezone-action@v1.1
        with:
          timezoneLinux: 'Australia/Sydney'

      - name: Fetch current date
        shell: bash
        run: |
          TIMESTAMP="$(date +%d-%m-%Y)"
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Build ISO
        uses: jasonn3/build-container-installer@v1.5.0
        id: build
        with:
          arch: x86_64
          version: ${{ matrix.major_version }}
          image_repo: ${{ env.IMAGE_REGISTRY }}
          image_name: ${{ matrix.image_name }}
          image_tag: ${{ matrix.image_tag }}
          variant: 'Sericea'
          iso_name: ${{ matrix.image_name }}_${{ env.TIMESTAMP }}.iso
          enable_cache_dnf: "false"
          enable_cache_skopeo: "false"
          enable_flatpak_dependencies: "false"
          flatpak_remote_name: "flathub-system"
          flatpak_remote_url: "https://flathub.org/repo/flathub.flatpakrepo"

      - name: Move ISO to Upload Directory
        id: upload-directory
        shell: bash
        run: |
          ISO_UPLOAD_DIR=${{ github.workspace }}/upload
          mkdir ${ISO_UPLOAD_DIR}
          mv ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }} ${ISO_UPLOAD_DIR}
          mv ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM ${ISO_UPLOAD_DIR}
          echo "iso-upload-dir=${ISO_UPLOAD_DIR}" >> $GITHUB_OUTPUT

      - name: Upload ISO and Checksum to Job Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image_name }}-iso   # unique name per matrix entry
          path: ${{ steps.upload-directory.outputs.iso-upload-dir }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: iso-f${{ matrix.major_version }}-latest
          name: bog ISOs (Fedora ${{ matrix.major_version }})
          make_latest: true
          body: |
            Auto-built installer ISOs, refreshed on each image build/schedule.
            `bootc switch` from an existing Fedora Atomic install is still the recommended path — these ISOs are for installing from scratch.
          files: |
            ${{ steps.upload-directory.outputs.iso-upload-dir }}/*.iso
            ${{ steps.upload-directory.outputs.iso-upload-dir }}/*-CHECKSUM