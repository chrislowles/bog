name: Build ISO

on:
  schedule:
    - cron: "0 0 1 * *" # First day of every month at 00:00 UTC
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
    paths:
      - '.github/workflows/build-iso.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  MAJOR_VERSION: 44

jobs:
  build-iso:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image_name: [bog, bog-nvidia]
        major_version: [44]
        image_tag: [latest]
    steps:
      - name: Set timezone to Sydney
        uses: MathRobin/timezone-action@v1.1
        with:
          timezoneLinux: 'Australia/Sydney'
      - name: Fetch current date
        shell: bash
        run: |
          TIMESTAMP="$(date +%d-%m-%Y)"
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Build ISO
        uses: jasonn3/build-container-installer@v1.5.0
        id: build
        with:
          arch: x86_64
          version: ${{ matrix.major_version }}
          image_repo: ${{ env.IMAGE_REGISTRY }}
          image_name: ${{ matrix.image_name }}
          image_tag: ${{ matrix.image_tag }}
          variant: 'Sericea'
          iso_name: ${{ matrix.image_name }}.iso
          enable_cache_dnf: false
          enable_cache_skopeo: false
          enable_flatpak_dependencies: false
          flatpak_remote_name: flathub-system
          flatpak_remote_url: "https://dl.flathub.org/repo/flathub.flatpakrepo"
          #web_ui: true
      - name: Move ISO to Upload Directory
        id: upload-directory
        shell: bash
        run: |
          ISO_UPLOAD_DIR=${{ github.workspace }}/upload
          mkdir ${ISO_UPLOAD_DIR}
          mv ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }} ${ISO_UPLOAD_DIR}
          mv ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM ${ISO_UPLOAD_DIR}
          echo "iso-upload-dir=${ISO_UPLOAD_DIR}" >> $GITHUB_OUTPUT
      - name: Upload ISO and Checksum to Job Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image_name }}-iso
          path: ${{ steps.upload-directory.outputs.iso-upload-dir }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true
      - name: Upload ISO to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp \
            "${{ steps.upload-directory.outputs.iso-upload-dir }}/${{ steps.build.outputs.iso_name }}" \
            "s3://${{ vars.R2_BUCKET }}/${{ matrix.image_name }}.iso" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --region auto
      - name: Write release metadata
        shell: bash
        run: |
          mkdir -p meta
          cp "${{ steps.upload-directory.outputs.iso-upload-dir }}/${{ steps.build.outputs.iso_name }}-CHECKSUM" meta/
          {
            echo "image_name=${{ matrix.image_name }}"
            echo "iso_name=${{ steps.build.outputs.iso_name }}"
            echo "iso_url=${{ vars.R2_PUBLIC_URL }}/${{ matrix.image_name }}.iso"
            echo "build_date=${{ env.TIMESTAMP }}"
          } > "meta/${{ matrix.image_name }}.env"
      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image_name }}-meta
          path: meta/
          if-no-files-found: error
          retention-days: 1
  publish-release:
    timeout-minutes: 25
    needs: build-iso
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          pattern: "*-meta"
          path: meta
      - name: Build release body
        shell: bash
        run: |
          {
            echo "Auto-built installer ISOs, refreshed on each image build/schedule. \`bootc switch\` from an existing Fedora Atomic install is still the recommended path — these ISOs are for installing from scratch."
            echo ""
            echo "| Image | Download | Built | SHA256 |"
            echo "|---|---|---|---|"
            for dir in meta/*-meta; do
              source "$dir"/*.env
              CHECKSUM_FILE=$(find "$dir" -name '*-CHECKSUM')
              SUM=$(cut -d' ' -f1 "$CHECKSUM_FILE")
              echo "| $image_name | [$image_name.iso]($iso_url) | $build_date | \`$SUM\` |"
            done
          } > body.md
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: bog-${{ env.MAJOR_VERSION }}-latest
          name: bog ${{ env.MAJOR_VERSION }} ISOs
          make_latest: true
          body_path: body.md
          overwrite_files: true
          files: meta/*-meta/*-CHECKSUM