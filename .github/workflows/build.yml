name: Bluebuild Release

on:
  schedule:
    - cron: '0 10 * * 3' # Every Wednesday at 10AM UTC
  push:
    branches: 
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  push-update:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        recipe:
          - recipe.yml
          - recipe-nvidia.yml
    steps:
      - name: Build Image
        uses: blue-build/github-action@v1.12.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true # enabled by default, disable if your image is small and you want faster builds